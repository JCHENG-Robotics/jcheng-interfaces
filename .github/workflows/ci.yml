name: contract-ci

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  m1-gate:
    name: m1-gate
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Repository gate
        shell: bash
        run: bash scripts/check_repo_gate.sh

  m2-contract:
    name: m2-contract
    runs-on: ubuntu-latest
    timeout-minutes: 20
    container:
      image: ros:humble-ros-base@sha256:dfc94c85d8e01f230951b2a85ca5576e08473081c3da5fbbe8f3ab844703b9ba
    env:
      DEBIAN_FRONTEND: noninteractive
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Install git for checkout
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates
      - name: Checkout
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Install build and test dependencies
        shell: bash
        run: |
          apt-get update
          apt-get install -y --no-install-recommends \
            python3-colcon-common-extensions \
            python3-pip \
            python3-setuptools \
            python3-yaml \
            ros-humble-ament-cmake \
            ros-humble-ament-lint-auto \
            ros-humble-ament-lint-common \
            ros-humble-builtin-interfaces \
            ros-humble-geometry-msgs \
            ros-humble-rosidl-default-generators \
            ros-humble-rosidl-default-runtime \
            ros-humble-std-msgs
      - name: Install Python contract test tooling
        shell: bash
        run: |
          python3 -m pip install --no-cache-dir \
            'jsonschema==4.23.0' \
            'pytest==8.3.4'
      - name: Build jcheng_interfaces
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          colcon build \
            --base-paths ros2_ws/src \
            --packages-select jcheng_interfaces \
            --event-handlers console_cohesion+
      - name: Contract checks
        shell: bash
        run: |
          source /opt/ros/humble/setup.bash
          source install/setup.bash
          python3 tools/generate_manifest.py --check
          python3 tools/check_schemas.py
          python3 tools/check_no_hardware.py
          python3 -m pytest -q
          ros2 interface show jcheng_interfaces/msg/MotionCommand >/dev/null

  # Pilot: run the organization contract-check next to the repository-local
  # m2-contract job. `v1` is a moving major alias for the organization reusable
  # workflows; it moves only for CI security or fix changes.
  org-contract-check:
    name: org-contract-check
    uses: JCHENG-Robotics/.github/.github/workflows/reusable-contract-check.yml@v1
    with:
      interfaces-path: "."
      base-ref: "v0.2.0"
      run-tests: true
