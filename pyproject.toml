[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "jcheng-contracts"
version = "0.2.0"
description = "JCHENG Robotics contract bindings, error registry and manifest tooling"
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
dev = [
  "jsonschema>=4.18",
  "PyYAML>=6.0",
  "pytest>=8.0",
]

[tool.setuptools]
package-dir = {"" = "python"}
packages = ["jcheng_contracts"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "python"]
addopts = "-q"
